# nginx reverse proxy for the portal.
#
# Upstream replicas are resolved through Docker's embedded DNS so that
# `docker compose up -d --scale portal=4` is picked up without a reload.

resolver 127.0.0.11 valid=10s ipv6=off;

# Matches settings.max_upload_bytes (25 MB) with headroom for multipart framing.
client_max_body_size 32m;
client_body_buffer_size 1m;

# Submissions upload to the teacher's Drive inside the request, so give the
# backend time. The portal itself returns 503 + Retry-After when it is
# saturated rather than hanging, so this is a ceiling, not a wait.
proxy_connect_timeout 5s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;

gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml;
gzip_min_length 1024;
gzip_vary on;

upstream portal_backends {
    # Single entry point; the resolver expands it to every live replica.
    server portal:8000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/portal.access.log;

    location /healthz {
        proxy_pass http://portal_backends;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Static assets are served by the app but cache well; they are content-
    # hashed by nothing, so keep the TTL short and lean on revalidation.
    location /static/ {
        proxy_pass http://portal_backends;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location / {
        proxy_pass http://portal_backends;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Required for uvicorn --proxy-headers to see the real client IP,
        # which the in-process rate limiter keys on.
        proxy_set_header X-Forwarded-Host $host;
    }
}
