[project]
name = "coursework-portal"
version = "1.0.0"
description = "College assignments portal with Google Drive sync, similarity indexing and AI detection"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run: the analysis pool is a session-scoped
# fixture and its worker tasks must live on the same loop as the tests.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q --timeout=120"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 fires on FastAPI's `File(...)` / `Depends(...)` signature defaults, which
# is the framework's documented idiom rather than a mutable-default bug.
ignore = ["B008"]
